<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Join URF Secret Server</title>
</head>
<body style="font-family:sans-serif;background:#111;color:#eee;text-align:center;padding-top:12vh">
<h2>🟢 Join URF Secret Server</h2>
<p>Make sure Tailscale says <b>Connected</b> first.</p>
<button id="go" style="font-size:18px;padding:14px 24px;background:#2ecc71;border:0;border-radius:8px;cursor:pointer">
📋 Copy command &amp; launch Rust
</button>
<p id="msg" style="margin-top:20px"></p>
<p style="opacity:.7">Command: <code>client.connect 100.66.133.48:28015</code></p>
<script>
const cmd = "client.connect 100.66.133.48:28015";
document.getElementById("go").onclick = async () => {
  try { await navigator.clipboard.writeText(cmd); } catch (e) {}
  document.getElementById("msg").innerHTML =
    "Copied! When Rust loads: press <b>F1</b>, then <b>Ctrl+V</b>, then <b>Enter</b>.";
  window.location.href = "steam://run/252490";
};
</script>
</body>
</html>
